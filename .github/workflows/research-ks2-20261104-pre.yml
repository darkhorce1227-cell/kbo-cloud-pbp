name: KS2 2026-11-04 market-blind research PRE
on:
  push:
    branches: [research/ks2-20261104-market-blind]
    paths:
      - '.github/workflows/research-ks2-20261104-pre.yml'
      - 'scripts/research_ks2_20261104_premarket.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'scipy>=1.11' 'numpy>=1.26,<3'
      - name: Fetch previously validated PBP, no target-game result possible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ks2
          gh release download latest-pbp --pattern 'kbo_pbp_2026_latest.parquet' --dir /tmp/ks2 --clobber
          echo '32c70d31c89c83a9e8606254ff6ec084f599371b6debc6dde36066bf122c74e1  /tmp/ks2/kbo_pbp_2026_latest.parquet' | sha256sum -c -
      - name: Compute market-blind reference probabilities
        run: python scripts/research_ks2_20261104_premarket.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KS2-20261104-market-blind-research-pre
          path: /tmp/ks2/ks2_premarket_20261104.json
          if-no-files-found: warn
