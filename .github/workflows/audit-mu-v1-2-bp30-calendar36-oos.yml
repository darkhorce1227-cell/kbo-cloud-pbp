name: Audit Mu v1.2 BP30 Calendar36 OOS

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_mu_v1_2_bp30_calendar36_oos.py"
      - ".github/workflows/audit-mu-v1-2-bp30-calendar36-oos.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: kbo-history-${{ runner.os }}-mechanical-mu-v13
          restore-keys: |
            kbo-history-${{ runner.os }}-mechanical-mu-
            kbo-history-${{ runner.os }}-
      - run: pip install -r requirements.txt
      - name: Confirm BP30 calendar36 on 2026 OOS
        run: python scripts/audit_mu_v1_2_bp30_calendar36_oos.py
      - name: Commit diagnostic state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/mu_v1_2_bp30_calendar36_oos.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record mu-v1.2 BP30 calendar36 OOS confirmation"
          git pull --rebase origin main
          git push
