name: Research pitcher platoon residual OOS 2024-2026
on:
  push:
    branches: [research/platoon-interaction-oos-20261106]
    paths:
      - 'scripts/research_platoon_interaction_oos_20261106.py'
      - '.github/workflows/research-platoon-interaction-oos.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'pyarrow>=15' 'scipy>=1.11' 'scikit-learn>=1.3'
      - name: Download immutable historical 2024-2025 and 2026 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/kbo-platoon
          gh run download 37073907739 --repo darkhorce1227-cell/kbo-cloud-pbp --name kbo-mu-training-pbp-2024-2025 --dir /tmp/kbo-platoon
          gh release download latest-pbp --pattern 'kbo_pbp_2026_latest.parquet' --dir /tmp/kbo-platoon --clobber
          gh release download latest-pbp --pattern 'manifest.json' --dir /tmp/kbo-platoon --clobber
      - name: SHA and source integrity validation
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd,json,hashlib
          p=Path('/tmp/kbo-platoon')
          m=json.loads((p/'manifest_mu_training.json').read_text())
          xs=[]
          for year in [2024,2025]:
           d=m['seasons'][str(year)]; f=p/d['file']
           assert hashlib.sha256(f.read_bytes()).hexdigest()==d['sha256']
           x=pd.read_csv(f)
           assert len(x)==d['rows'] and x.game_pk.nunique()==d['games']
           assert not x.duplicated(['game_pk','at_bat_number','pitch_number']).any()
           xs.append(x)
          pd.concat(xs,ignore_index=True).to_parquet(p/'kbo_rs_2024_2025.parquet',index=False)
          f=p/'kbo_pbp_2026_latest.parquet';h=hashlib.sha256(f.read_bytes()).hexdigest()
          mm=json.loads((p/'manifest.json').read_text())
          print('2026_RELEASE_SHA='+h)
          print('2026_RELEASE_MANIFEST='+json.dumps(mm,ensure_ascii=False)[:2000])
          x=pd.read_parquet(f)
          rs=x[x.game_date.astype(str).le('2026-10-12')]
          assert rs.game_pk.nunique()==720,rs.game_pk.nunique()
          assert not rs.duplicated(['game_pk','at_bat_number','pitch_number']).any()
          print('VALIDATED_2024_2025_ARCHIVE_AND_2026_RS_720_GAMES')
          PY
      - name: Frozen 2-period matched platoon OOS
        run: python -u scripts/research_platoon_interaction_oos_20261106.py
      - name: Summary
        if: always()
        run: |
          if test -f /tmp/kbo-platoon/platoon_oos_result.json; then
            cat /tmp/kbo-platoon/platoon_oos_result.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KBO-platoon-interaction-OOS-research-20261106
          path: /tmp/kbo-platoon/platoon_oos_result.json
          if-no-files-found: warn
