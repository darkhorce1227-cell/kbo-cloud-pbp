name: Build PS starter appearances

on:
  push:
    paths:
      - 'scripts/build_ps_starter_appearances.py'
      - '.github/workflows/build-ps-starter-appearances.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow
      - name: Download screened historical PS master
        run: |
          mkdir -p historical_ps
          curl -L --fail --retry 3 \
            -o historical_ps/postseason_screen_pass.parquet \
            https://github.com/darkhorce1227-cell/kbo-cloud-pbp/releases/download/historical-ps-master/postseason_screen_pass.parquet
      - name: Diagnose 2016 and 2018 exceptions
        run: |
          python - <<'PY'
          import pandas as pd
          df = pd.read_parquet('historical_ps/postseason_screen_pass.parquet').reset_index(drop=True)
          targets=[(2016,'33331014LGWO02016'),(2018,'77771112SKOB02018')]
          for season, game_pk in targets:
              g=df[(df.season==season)&(df.game_pk.astype(str)==game_pk)].copy()
              pa=g.groupby(['season','game_pk','at_bat_number'],sort=False).tail(1).copy()
              pa['delta']=pa['post_outs']-pa['outs_when_up']
              print('\nGAME',season,game_pk,'rows',len(g),'PA',len(pa))
              half=(pa.groupby(['inning','inning_topbot'],sort=False)
                      .agg(first_outs=('outs_when_up','first'),final_outs=('post_outs','last'),sum_delta=('delta','sum'),last_ab=('at_bat_number','last'))
                      .reset_index())
              print(half.to_string(index=False))
              bad=half[half.final_outs<3]
              for h in bad.itertuples(index=False):
                  ctx=pa[(pa.inning==h.inning)&(pa.inning_topbot==h.inning_topbot)].tail(5)
                  cols=[c for c in ['inning','inning_topbot','at_bat_number','batter_name','pitcher_name','outs_when_up','post_outs','events','_naver_events','description'] if c in ctx.columns]
                  print('\nHALF_CONTEXT',h.inning,h.inning_topbot)
                  print(ctx[cols].to_string(index=False))
                  raw=g[(g.inning==h.inning)&(g.inning_topbot==h.inning_topbot)].tail(15)
                  rcols=[c for c in ['at_bat_number','pitch_number','batter_name','pitcher_name','outs_when_up','post_outs','events','_naver_events','description'] if c in raw.columns]
                  print('\nRAW_TAIL')
                  print(raw[rcols].to_string(index=False))
          PY
