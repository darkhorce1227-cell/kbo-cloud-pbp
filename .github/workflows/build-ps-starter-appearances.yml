name: Build PS starter appearances

on:
  push:
    paths:
      - 'scripts/build_ps_starter_appearances.py'
      - '.github/workflows/build-ps-starter-appearances.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime deps
        run: pip install pandas pyarrow

      - name: Download screened historical PS master
        run: |
          mkdir -p historical_ps
          curl -L --fail --retry 3 \
            -o historical_ps/postseason_screen_pass.parquet \
            https://github.com/darkhorce1227-cell/kbo-cloud-pbp/releases/download/historical-ps-master/postseason_screen_pass.parquet

      - name: Inspect 2016-2025 explicit-out rows with zero out delta
        run: |
          python - <<'PY'
          import pandas as pd

          df = pd.read_parquet('historical_ps/postseason_screen_pass.parquet').reset_index(drop=True)
          keys = ['season','game_pk','at_bat_number']
          pa = df.groupby(keys, sort=False).tail(1).copy()
          pa['delta'] = pd.to_numeric(pa['post_outs'], errors='coerce') - pd.to_numeric(pa['outs_when_up'], errors='coerce')
          explicit = {'strikeout','field_out','double_play','force_out','sac_bunt','sac_fly','triple_play'}
          bad = pa[(pa['season'].between(2016, 2025)) & pa['events'].astype(str).isin(explicit) & (pa['delta'] == 0)].copy()

          print('ANOMALY_COUNT', len(bad))
          cols = [c for c in [
              'season','game_date','game_pk','inning','inning_topbot','at_bat_number',
              'batter_name','pitcher_name','outs_when_up','post_outs','events','_naver_events',
              'description','post_home_score','post_away_score'
          ] if c in bad.columns]
          print(bad[cols].to_string(index=False))

          print('\nPA_CONTEXT')
          for r in bad.itertuples(index=False):
              g = pa[(pa['season']==r.season) & (pa['game_pk']==r.game_pk)]
              pos = g.index.get_loc(r.Index) if hasattr(r, 'Index') else None
              target_ab = int(r.at_bat_number)
              ctx = g[g['at_bat_number'].between(target_ab-1, target_ab+1)]
              ccols = [c for c in [
                  'inning','inning_topbot','at_bat_number','batter_name','pitcher_name',
                  'outs_when_up','post_outs','events','_naver_events'
              ] if c in ctx.columns]
              print('\n', int(r.season), r.game_pk, 'AB', target_ab)
              print(ctx[ccols].to_string(index=False))
          PY
