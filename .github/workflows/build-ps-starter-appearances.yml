name: Build PS starter appearances

on:
  push:
    paths:
      - 'scripts/build_ps_starter_appearances.py'
      - '.github/workflows/build-ps-starter-appearances.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime deps
        run: pip install pandas pyarrow

      - name: Download screened historical PS master
        run: |
          mkdir -p historical_ps
          curl -L --fail --retry 3 \
            -o historical_ps/postseason_screen_pass.parquet \
            https://github.com/darkhorce1227-cell/kbo-cloud-pbp/releases/download/historical-ps-master/postseason_screen_pass.parquet

      - name: Build production starter appearances
        run: |
          python scripts/build_ps_starter_appearances.py \
            --input historical_ps/postseason_screen_pass.parquet
          cat historical_ps/ps_starter_appearances_validation.json

      - name: Require production coverage and integrity
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          audit = json.loads(Path('historical_ps/ps_starter_appearances_validation.json').read_text(encoding='utf-8'))
          starters = pd.read_csv('historical_ps/ps_starter_appearances.csv')

          if audit['status'] != 'PASS':
              raise SystemExit(f"starter appearance audit failed: {audit['critical_failures']}")

          c16 = audit['coverage']['2016_2025']
          c17 = audit['coverage']['2017_2025']
          if (c16['games'], c16['starter_appearances']) != (143, 286):
              raise SystemExit(f"unexpected 2016-2025 coverage: {c16}")
          if (c17['games'], c17['starter_appearances']) != (129, 258):
              raise SystemExit(f"unexpected 2017-2025 coverage: {c17}")
          if not (starters['out_state_integrity'] == 'PASS').all():
              raise SystemExit('non-PASS out-state row leaked into production starter artifact')
          if starters['actual_outs'].sum() <= 0:
              raise SystemExit('starter actual_outs sum is non-positive')

          boundary = audit['boundary_out_reconstruction']
          if (boundary['halves'], boundary['outs_added']) != (2, 2):
              raise SystemExit(f"unexpected boundary reconstruction: {boundary}")

          print({
              'status': audit['status'],
              'input_games': audit['input_games'],
              'production_games': audit['production_games'],
              'unavailable_games': audit['unavailable_games'],
              'coverage_2016_2025': c16,
              'coverage_2017_2025': c17,
              'boundary_out_reconstruction': {
                  'halves': boundary['halves'],
                  'outs_added': boundary['outs_added'],
              },
              'starter_actual_outs_sum': int(starters['actual_outs'].sum()),
          })
          PY

      - name: Commit validated outputs
        run: |
          rm -f historical_ps/postseason_screen_pass.parquet
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add historical_ps/ps_starter_appearances.csv \
                  historical_ps/ps_starter_appearances_validation.json \
                  historical_ps/ps_starter_appearances_defense_outs_audit.csv
          if git diff --cached --quiet; then
            echo 'No output changes to commit'
          else
            git commit -m 'Publish audited postseason starter appearance artifact'
            git push
          fi
