name: Test Recovered Mu v1.2 Challenger

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/mu_v1_2_recovered_challenger.py"
      - "research/mu-v1.2/recovered_challenger.json"
      - "research/mu-v1.2/recovery_status.json"
      - ".github/workflows/test-mu-v1-2-recovered-challenger.yml"

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: kbo-history-${{ runner.os }}-mechanical-mu-v13
          restore-keys: |
            kbo-history-${{ runner.os }}-mechanical-mu-
            kbo-history-${{ runner.os }}-
      - run: pip install -r requirements.txt
      - name: Compile challenger runner
        run: python -m py_compile scripts/mu_v1_2_recovered_challenger.py
      - name: Recompute frozen 2026 OOS candidate
        run: python scripts/audit_mu_v1_2_recovered_final_candidate.py
      - name: Verify reference metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          meta=json.loads(Path('research/mu-v1.2/recovered_challenger.json').read_text())
          got=json.loads(Path('state/mu_v1_2_recovered_final_candidate_oos.json').read_text())['recovered_2026_oos']
          ref=meta['frozen_2026_oos_reference']
          checks={
              'f5_mae':got['f5']['mae'],
              'f5_wdl_logloss':got['f5']['wdl_logloss'],
              'f5_decided_side':got['f5']['decided_side'],
              'f5_mean_mu':got['f5']['mean_mu'],
              'full_mae':got['full']['mae'],
              'full_wdl_logloss':got['full']['wdl_logloss'],
              'full_decided_side':got['full']['decided_side'],
              'full_mean_mu':got['full']['mean_mu'],
          }
          bad={k:(v,ref[k]) for k,v in checks.items() if abs(v-ref[k])>1e-10}
          if bad:
              raise SystemExit(f'regression mismatch: {bad}')
          print('RECOVERED_CHALLENGER_REGRESSION_PASS')
          PY
