name: 2024 train 2025 test KBO lineup prediction study
on:
  push:
    branches: [research/lineup-multiyear-20261104]
    paths:
      - '.github/workflows/research-lineup-2024-25-oos.yml'
      - 'scripts/research_lineup_2024train_2025test.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'pyarrow>=15' 'scipy>=1.11' 'scikit-learn>=1.3'
      - name: Download frozen RS 2024-25 with original asset manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/kbo-multiyear
          gh run download 37073907739 --repo darkhorce1227-cell/kbo-cloud-pbp --name kbo-mu-training-pbp-2024-2025 --dir /tmp/kbo-multiyear
      - name: SHA/row/duplicate checks and concatenate
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd,json,hashlib
          p=Path('/tmp/kbo-multiyear')
          m=json.loads((p/'manifest_mu_training.json').read_text())
          xs=[]
          for year in [2024,2025]:
           d=m['seasons'][str(year)]
           file=p/d['file']
           assert hashlib.sha256(file.read_bytes()).hexdigest()==d['sha256']
           x=pd.read_csv(file)
           assert len(x)==d['rows'] and x.game_pk.nunique()==d['games']
           assert not x.duplicated(['game_pk','at_bat_number','pitch_number']).any()
           xs.append(x)
          allgames=pd.concat(xs,ignore_index=True)
          assert allgames.game_pk.nunique()==1472
          allgames.to_parquet(p/'kbo_rs_2024_2025.parquet',index=False)
          print('HISTORICAL_INPUTS_PASS=2024_2025_SHA_AND_GAMES')
          PY
      - name: Fixed 2024 training to 2025 test scoring eval
        run: python scripts/research_lineup_2024train_2025test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KBO-2024-train-2025-test-lineup-study
          path: /tmp/kbo-multiyear/lineup_shadow_2024train_2025test.json
          if-no-files-found: warn
