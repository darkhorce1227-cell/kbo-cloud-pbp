name: Compare Historical Postseason Relay Events
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Compare event codes across seasons
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p historical_ps
          for YEAR in 2008 2009 2010 2011 2012 2021; do
            gh release download "historical-ps-$YEAR" --pattern "kbo_ps_${YEAR}_raw.tar.gz" --dir /tmp
            tar -xzf "/tmp/kbo_ps_${YEAR}_raw.tar.gz" -C historical_ps
          done
          python scripts/compare_postseason_relay_events.py
      - name: Upload event comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postseason-relay-event-comparison
          path: |
            historical_ps/relay_event_comparison.json
            historical_ps/*/relay_event_comparison.csv
          if-no-files-found: warn
