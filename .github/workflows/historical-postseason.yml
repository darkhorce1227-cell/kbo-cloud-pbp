name: Historical KBO Postseason PBP
on:
  workflow_call:
    inputs:
      year:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      year:
        description: "Historical season"
        required: true
        default: "2021"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Collect postseason relay
        id: collect
        continue-on-error: true
        run: python scripts/historical_postseason.py --year "${{ inputs.year }}"
      - name: Validate and export pitch-level PBP
        id: export
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: python scripts/export_historical_postseason.py --year "${{ inputs.year }}"
      - name: Upload diagnostic data (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-ps-${{ inputs.year }}
          path: historical_ps/${{ inputs.year }}/
          if-no-files-found: warn
      - name: Publish validated complete or partial datasets
        if: steps.collect.outcome == 'success' && steps.export.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          YEAR: ${{ inputs.year }}
        run: |
          TAG="historical-ps-${YEAR}"
          tar -czf "kbo_ps_${YEAR}_raw.tar.gz" -C historical_ps "${YEAR}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "KBO postseason ${YEAR} PBP (see validation.json for coverage)" --notes "Coverage can be PARTIAL. Always check validation.json before analysis."
          gh release upload "$TAG" "kbo_ps_${YEAR}_raw.tar.gz" --clobber
          gh release upload "$TAG" "historical_ps/${YEAR}/postseason_pitches.csv.gz" "historical_ps/${YEAR}/postseason_pitches.parquet" "historical_ps/${YEAR}/validation.json" "historical_ps/${YEAR}/missing_innings.csv" --clobber
      - name: Handle unavailable legacy season or fail unexpected error
        if: steps.collect.outcome != 'success' || steps.export.outcome != 'success'
        env:
          YEAR: ${{ inputs.year }}
        run: |
          set -euo pipefail
          if [ "$YEAR" -le 2007 ] && [ -f "historical_ps/$YEAR/manifest.json" ] && \
             grep -qi "no games returned\|No postseason games" "historical_ps/$YEAR/manifest.json"; then
            echo "::warning::Naver schedule API has no usable season schedule for $YEAR; recorded as unavailable rather than a pipeline failure."
            exit 0
          fi
          echo "Unexpected collection/export failure for $YEAR"
          exit 1
