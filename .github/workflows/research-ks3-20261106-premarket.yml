name: KS3 2026-11-06 research premarket forecast
on:
  push:
    branches: [research/ks3-20261106-clean-pre]
    paths:
      - '.github/workflows/research-ks3-20261106-premarket.yml'
      - 'scripts/research_ks3_20261106_premarket.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pipeline dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11'
      - name: Fetch validated 2026 original PBP through 11-04
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/kbo-ks3
          gh release download latest-pbp --pattern kbo_pbp_2026_latest.parquet --dir /tmp/kbo-ks3 --clobber
          echo '0ca95818ac8ea00030f79d8f5aa9c98987acb4edd334a8228ef9fb3503e12d4e  /tmp/kbo-ks3/kbo_pbp_2026_latest.parquet' | sha256sum -c -
      - name: Run price-blind pregame research
        run: python scripts/research_ks3_20261106_premarket.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KS3-20261106-market-unseen-research-pre
          path: /tmp/kbo-ks3/ks3_premarket_20261106.json
          if-no-files-found: warn
