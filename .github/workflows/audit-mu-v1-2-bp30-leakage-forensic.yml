name: Audit Mu v1.2 BP30 Leakage Forensic

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_mu_v1_2_bp30_leakage_forensic.py"
      - ".github/workflows/audit-mu-v1-2-bp30-leakage-forensic.yml"

permissions:
  contents: write

concurrency:
  group: kbo-mu-v1-2-bp30-leakage-forensic
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: kbo-history-${{ runner.os }}-mechanical-mu-bp30-forensic
          restore-keys: |
            kbo-history-${{ runner.os }}-mechanical-mu-
            kbo-history-${{ runner.os }}-
      - run: pip install -r requirements.txt
      - name: Compare BP30 leakage candidates
        run: python scripts/audit_mu_v1_2_bp30_leakage_forensic.py
      - name: Commit diagnostic state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state/mu_v1_2_bp30_leakage_forensic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record mu-v1.2 BP30 leakage forensic"
          git fetch origin main
          git rebase --autostash origin/main
          git push
