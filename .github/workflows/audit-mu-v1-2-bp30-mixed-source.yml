name: Audit Mu v1.2 BP30 Mixed Source

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/diagnose_mu_v1_2_bp30_mixed_source.py"
      - ".github/workflows/audit-mu-v1-2-bp30-mixed-source.yml"

permissions:
  actions: read
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: kbo-mu-training-pbp-2024-2025
          path: out_training
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: darkhorce1227-cell/kbo-cloud-pbp
          run-id: 37073907739
      - name: Diagnose BP30 mixed source semantics
        run: python scripts/diagnose_mu_v1_2_bp30_mixed_source.py
      - name: Commit diagnostic state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git pull --rebase origin main
          git add -f state/mu_v1_2_bp30_mixed_source.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record mu-v1.2 BP30 mixed-source diagnostic"
          git push
