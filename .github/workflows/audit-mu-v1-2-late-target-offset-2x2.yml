name: Audit Mu v1.2 Late Target Offset 2x2

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_mu_v1_2_late_target_offset_2x2.py"
      - ".github/workflows/audit-mu-v1-2-late-target-offset-2x2.yml"

permissions:
  contents: write

concurrency:
  group: audit-mu-v1-2-late-target-offset-2x2
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: kbo-history-${{ runner.os }}-mechanical-mu-v13
          restore-keys: |
            kbo-history-${{ runner.os }}-mechanical-mu-
            kbo-history-${{ runner.os }}-
      - run: pip install -r requirements.txt
      - name: Audit late target x offset semantics
        run: python scripts/audit_mu_v1_2_late_target_offset_2x2.py
      - name: Commit diagnostic state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/mu_v1_2_late_target_offset_2x2.json
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "research: record mu-v1.2 late target offset 2x2"
          git pull --rebase origin main
          git push
