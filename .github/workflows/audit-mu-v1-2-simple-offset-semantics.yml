name: Audit Mu v1.2 Simple Offset Semantics

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_mu_v1_2_simple_offset_semantics.py"
      - ".github/workflows/audit-mu-v1-2-simple-offset-semantics.yml"

permissions:
  contents: write

concurrency:
  group: kbo-mu-v1-2-simple-offset-semantics
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: kbo-history-${{ runner.os }}-mechanical-mu-v13
          restore-keys: |
            kbo-history-${{ runner.os }}-mechanical-mu-
            kbo-history-${{ runner.os }}-
      - run: pip install -r requirements.txt
      - name: Audit simple offset semantics
        run: python scripts/audit_mu_v1_2_simple_offset_semantics.py
      - name: Commit diagnostic state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state/mu_v1_2_simple_offset_semantics.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record mu-v1.2 simple offset diagnostic"
          git fetch origin main
          git rebase --autostash origin/main
          git push
