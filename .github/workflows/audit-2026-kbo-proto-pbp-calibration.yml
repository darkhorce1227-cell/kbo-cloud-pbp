name: Audit 2026 KBO Proto archival odds results and calibrate

on:
  push:
    branches: [main]
    paths: [.github/workflows/audit-2026-kbo-proto-pbp-calibration.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proto-kbo-archival-calibration
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install score-audit dependencies
        run: pip install 'pandas>=2.2,<3' 'pyarrow>=15'
      - name: Fetch exact published 2026 validated PBP binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/kbo-market
          gh release download latest-pbp \
            --pattern kbo_pbp_2026_latest.parquet \
            --dir /tmp/kbo-market --clobber
          test -s /tmp/kbo-market/kbo_pbp_2026_latest.parquet
      - name: Compare all matched archival results against actual pitch-by-pitch final scores
        run: |
          python scripts/audit_2026_proto_market_vs_pbp.py \
            --pbp /tmp/kbo-market/kbo_pbp_2026_latest.parquet
      - name: Compute market fair-price calibration with clustered uncertainty
        run: |
          python scripts/analyze_2026_kbo_proto_archive.py
          cat research/market_fair_odds/sharppick_2026_r112_r122_market_calibration.json
      - name: Require result audit PASS and prohibit model validation overclaim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/market_fair_odds')
          a=json.loads((p/'sharppick_2026_r112_r122_pbp_result_audit.json').read_text())
          b=json.loads((p/'sharppick_2026_r112_r122_market_calibration.json').read_text())
          assert a['status']=='PASS' and a['missing_pbp_games']==[] and a['score_disagreements']==[],a
          assert a['market_unique_games']==b['number_of_unique_games']
          assert b['status']=='DESCRIPTIVE_HISTORICAL_MARKET_CALIBRATION_NOT_CLEAN_PRE'
          assert b['timestamp_certainty']=='UNVERIFIED_PRICE_TIME'
          assert b['distinct_game_markets']>=100
          PY
      - name: Commit audited sample and descriptive calibration
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/market_fair_odds/sharppick_2026_r112_r122_*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Score SHA-verified KBO archival markets and no-vig calibration'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Preserve audit report on failure for forensic review
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kbo-market-calibration-forensic
          path: research/market_fair_odds/sharppick_2026_r112_r122_*.json
          retention-days: 7
          if-no-files-found: ignore
