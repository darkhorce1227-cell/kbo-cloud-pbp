name: KT bridge vs pooled 6-8 runs - chronological OOS
on:
  push:
    branches: [research/kt-bridge-pregame-20261104]
    paths:
      - '.github/workflows/research-kt-bridge-pregame-oos.yml'
      - 'scripts/research_kt_bridge_oos_2026.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install study deps
        run: python -m pip install 'pandas>=2.2,<3' 'pyarrow>=15' 'numpy>=1.26,<3' 'scipy>=1.11'
      - name: Download immutable 2026 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/kt-bridge-verify
          gh release download latest-pbp --pattern 'kbo_pbp_2026_latest.parquet' --dir /tmp/kt-bridge-verify --clobber
          echo "32c70d31c89c83a9e8606254ff6ec084f599371b6debc6dde36066bf122c74e1  /tmp/kt-bridge-verify/kbo_pbp_2026_latest.parquet" | sha256sum -c -
      - name: Evaluate with no current-game features
        run: python scripts/research_kt_bridge_oos_2026.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kt-bridge-oos-2026
          path: /tmp/kt-bridge-verify/kt_bridge_oos_2026.json
          if-no-files-found: warn
