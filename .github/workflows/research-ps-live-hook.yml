name: Research PS Live-at-Hook First Follower
on:
  push:
    branches: [research/ps-follower-runs-20261102]
    paths:
      - '.github/workflows/research-ps-live-hook.yml'
      - 'scripts/research_ps_stage7_live_at_hook.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pandas>=2.2,<3' 'pyarrow>=15' 'numpy>=1.26,<3'
      - name: Download frozen PS PBP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ps-work
          gh release download historical-ps-master --pattern 'postseason_screen_pass.parquet' --dir /tmp/ps-work --clobber
          test -s /tmp/ps-work/postseason_screen_pass.parquet
      - name: Evaluate only-in-game-known hook inning
        run: python scripts/research_ps_stage7_live_at_hook.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ps-stage7-live-first-follower
          path: /tmp/ps-work/ps_stage7_live_follower.json
          if-no-files-found: warn
