name: Offline merge verified 2026-10-26 postseason KBO PBP ZIP
on:
  push:
    branches: [main]
    paths:
      - 'imports/kbo_20261026_HTSS_raw_20261027_152005.zip'
      - '.github/workflows/offline-recover-kbo-pbp-20261026.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kbo-pbp-cloud-update
  cancel-in-progress: false
jobs:
  offline-recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Checkout entire history for immutable prior PBP checkpoint
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install same KBO event parser and parquet runtime as main PBP pipeline
        run: pip install -r requirements.txt
      - name: Stop if original ZIP was not added or SHA-256 differs
        shell: bash
        run: |
          set -euo pipefail
          filename=imports/kbo_20261026_HTSS_raw_20261027_152005.zip
          test -s "$filename"
          echo "abb9ba6656cd23ea80f18b8817d5da49f775cf317367608a345c2fe86ab7aec2  $filename" | sha256sum --check --strict
      - name: Download existing rolling PBP release from GitHub (no Naver API)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previous_release
          gh release download latest-pbp \
            --pattern 'kbo_pbp_2026_latest.parquet' \
            --dir previous_release
          test -s previous_release/kbo_pbp_2026_latest.parquet
      - name: Rebuild and validate all 725 game IDs + 2026-10-26 score in binary
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/import_20261026_kbo_raw_zip_offline.py
          python scripts/import_20261026_kbo_raw_zip_offline.py \
            --zip imports/kbo_20261026_HTSS_raw_20261027_152005.zip \
            --prior previous_release/kbo_pbp_2026_latest.parquet
      - name: Assert score audit and prior game PKs before release changes
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('state/postgame_score_audit_2026-10-26.json').read_text())
          q=json.loads(Path('research/postseason_expected_ip/2026_shadow/offline_recovery_20261026_qa.json').read_text())
          s=json.loads(Path('state/status.json').read_text())
          ids=json.loads(Path('state/validated_game_pks_2026.json').read_text())
          assert a['validation']=='PASS' and a['source']=='validated_parquet_binary'
          assert a['official_crosscheck_games_found']==1
          assert a['games'][0]['official_final_crosscheck']=='PASS'
          assert a['games'][0]['final']['away']==5 and a['games'][0]['final']['home']==1
          assert s['validation']=='PASS' and s['should_publish'] is True
          assert ids['game_count']==725 and len(ids['game_pks'])==725
          assert '55551026HTSS02026' in ids['game_pks']
          assert q['new_dataset_rows']>q['old_dataset_rows']
          print('OFFLINE_20261026_725_GAME_COMBINED_PASS')
          PY
      - name: Publish GitHub-backed evidence and continuity checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kbo-pbp-bot"
          git config user.email "kbo-pbp-bot@users.noreply.github.com"
          git add \
            state/status.json \
            state/validated_game_pks_2026.json \
            state/pbp_recovery_targets.json \
            state/postgame_score_audit.json \
            state/postgame_score_audit_2026-10-26.json \
            research/postseason_expected_ip/2026_shadow/offline_recovery_20261026_qa.json
          if git diff --cached --quiet; then
            echo 'Refusing publish without validated status changes'
            exit 1
          fi
          git commit -m "backfill(PBP): verified offline KIA Samsung 2026-10-26 to 725 games"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Replace release only after complete SHA, score and game-PK gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload latest-pbp \
            out/kbo_pbp_2026_latest.csv.gz \
            out/kbo_pbp_2026_latest.parquet \
            out/manifest.json \
            state/status.json \
            state/validated_game_pks_2026.json \
            state/postgame_score_audit.json \
            --clobber
      - name: Verify latest rolling release contains updated source and size
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view latest-pbp --json assets --jq '.assets[] | [.name,.size] | @tsv'
      - name: Keep forensics on failure, never false PASS release
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 20261026-offline-merge-forensics
          path: |
            research/postseason_expected_ip/2026_shadow/offline_recovery_20261026_qa.json
            state/postgame_score_audit_2026-10-26.json
            state/run_result.json
          if-no-files-found: ignore
          retention-days: 14
