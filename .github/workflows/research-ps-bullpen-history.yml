name: Research PS Bullpen History Score Calibration
on:
  push:
    branches: [research/ps-follower-runs-20261102]
    paths:
      - '.github/workflows/research-ps-bullpen-history.yml'
      - 'scripts/research_ps_stage6_bullpen_history.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'pandas>=2.2,<3' 'pyarrow>=15' 'numpy>=1.26,<3' 'scipy>=1.11'
      - name: Download frozen historical PS PBP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ps-work
          gh release download historical-ps-master --pattern 'postseason_screen_pass.parquet' --dir /tmp/ps-work --clobber
          test -s /tmp/ps-work/postseason_screen_pass.parquet
      - name: Pre-game-only bullpen rate score calibration
        run: python scripts/research_ps_stage6_bullpen_history.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ps-stage6-bullpen-score-validation
          path: /tmp/ps-work/ps_stage6_bullpen_pregame.json
          if-no-files-found: warn
