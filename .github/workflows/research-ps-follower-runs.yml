name: Research PS Follower Runs (isolated branch)
on:
  push:
    branches:
      - research/ps-follower-runs-20261102
    paths:
      - '.github/workflows/research-ps-follower-runs.yml'
      - 'scripts/research_ps_stage4_hook_to_runs.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install 'pandas>=2.2,<3' 'pyarrow>=15' 'numpy>=1.26,<3' 'scipy>=1.11'
      - name: Fetch immutable historical screened PS PBP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ps-work
          gh release download historical-ps-master --pattern 'postseason_screen_pass.parquet' --dir /tmp/ps-work --clobber
          test -s /tmp/ps-work/postseason_screen_pass.parquet
          sha256sum /tmp/ps-work/postseason_screen_pass.parquet
      - name: Compute actual pitcher path and strict 2016-20 vs 2021-25 backtest
        run: python scripts/research_ps_stage4_hook_to_runs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ps-stage4-paths-and-temporal-validation
          path: /tmp/ps-work/stage4_results.json
          if-no-files-found: warn
