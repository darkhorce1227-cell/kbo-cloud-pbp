name: Research PS First Follower Predictability
on:
  push:
    branches: [research/ps-follower-runs-20261102]
    paths:
      - '.github/workflows/research-ps-first-follower.yml'
      - 'scripts/research_ps_stage5_first_follower.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-follower:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'pandas>=2.2,<3' 'pyarrow>=15' 'numpy>=1.26,<3'
      - name: Download historical PS raw PBP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ps-work
          gh release download historical-ps-master --pattern 'postseason_screen_pass.parquet' --dir /tmp/ps-work --clobber
          test -s /tmp/ps-work/postseason_screen_pass.parquet
      - name: Run frozen-calendar first-follower retrospective
        run: python scripts/research_ps_stage5_first_follower.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ps-stage5-first-follower-study
          path: /tmp/ps-work/ps_stage5_first_follower.json
          if-no-files-found: warn
