name: Diagnose Historical Postseason Orphan Pitches
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Diagnose pitches without batter PA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p historical_ps
          for YEAR in 2009 2010 2011 2012; do
            gh release download "historical-ps-$YEAR" --pattern "kbo_ps_${YEAR}_raw.tar.gz" --dir /tmp
            tar -xzf "/tmp/kbo_ps_${YEAR}_raw.tar.gz" -C historical_ps
          done
          python scripts/diagnose_postseason_orphan_pitches.py
      - name: Upload diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postseason-orphan-pitch-diagnosis
          path: |
            historical_ps/orphan_pitch_audit.csv
            historical_ps/orphan_pitch_samples.json
          if-no-files-found: warn
