name: Historical KBO Postseason Batch
on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "First season (inclusive)"
        required: true
        default: "2001"
      end_year:
        description: "Last season (inclusive)"
        required: true
        default: "2025"
  push:
    branches: [main]
    paths:
      - '.github/postseason-full-refresh.trigger'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      years: ${{ steps.years.outputs.years }}
    steps:
      - name: Validate range and generate year matrix
        id: years
        env:
          START: ${{ inputs.start_year || '2001' }}
          END: ${{ inputs.end_year || '2025' }}
        run: |
          python - <<'PY'
          import json, os
          start, end = int(os.environ["START"]), int(os.environ["END"])
          if not (2001 <= start <= end <= 2025):
              raise SystemExit("Expected 2001 <= start_year <= end_year <= 2025")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("years=" + json.dumps([str(y) for y in range(start, end + 1)]) + "\n")
          PY

  collect:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: ${{ fromJSON(needs.prepare.outputs.years) }}
    uses: ./.github/workflows/historical-postseason.yml
    with:
      year: ${{ matrix.year }}
    permissions:
      contents: write

  aggregate:
    needs: [prepare, collect]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Download every available season release
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          START: ${{ inputs.start_year || '2001' }}
          END: ${{ inputs.end_year || '2025' }}
        run: |
          set -euo pipefail
          mkdir -p historical_ps /tmp/postseason-releases
          DOWNLOADED=()
          for YEAR in $(seq "$START" "$END"); do
            mkdir -p "/tmp/postseason-releases/$YEAR"
            if gh release download "historical-ps-$YEAR" \
                --pattern "kbo_ps_${YEAR}_raw.tar.gz" \
                --dir "/tmp/postseason-releases/$YEAR"; then
              tar -xzf "/tmp/postseason-releases/$YEAR/kbo_ps_${YEAR}_raw.tar.gz" -C historical_ps
              DOWNLOADED+=("$YEAR")
            else
              echo "No usable release for $YEAR; recording as unavailable."
            fi
          done
          if [ ${#DOWNLOADED[@]} -eq 0 ]; then
            echo "No season releases available in requested range."
            exit 1
          fi
          printf '%s\n' "${DOWNLOADED[*]}" > historical_ps/downloaded_years.txt
          echo "years=${DOWNLOADED[*]}" >> "$GITHUB_OUTPUT"

      - name: Run automatic quality classification
        env:
          YEARS: ${{ steps.download.outputs.years }}
        run: |
          python scripts/postseason_quality_gate.py --years $YEARS

      - name: Build combined master datasets
        run: python scripts/build_postseason_master.py

      - name: Upload master artifact
        uses: actions/upload-artifact@v4
        with:
          name: postseason-master-${{ inputs.start_year || '2001' }}-${{ inputs.end_year || '2025' }}
          path: |
            historical_ps/quality_summary.json
            historical_ps/quality_summary.csv
            historical_ps/*/quality_by_game.csv
            historical_ps/postseason_dataset_index.csv
            historical_ps/postseason_master_summary.json
            historical_ps/postseason_all_available.parquet
            historical_ps/postseason_screen_pass.parquet
            historical_ps/downloaded_years.txt
          if-no-files-found: error

      - name: Publish rolling master release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="historical-ps-master"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "KBO historical postseason PBP master" \
              --notes "Automated aggregate. SCREEN_PASS is a screening result, not independent official-stat verification."
          gh release upload "$TAG" \
            historical_ps/quality_summary.json \
            historical_ps/quality_summary.csv \
            historical_ps/postseason_dataset_index.csv \
            historical_ps/postseason_master_summary.json \
            historical_ps/postseason_all_available.parquet \
            historical_ps/postseason_screen_pass.parquet \
            --clobber
