name: Audit Recovered Mu v1.2 Self-Starter OOS

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_mu_v1_2_recovered_selfstarter_oos.py"
      - ".github/workflows/audit-mu-v1-2-recovered-selfstarter-oos.yml"

permissions:
  contents: write

concurrency:
  group: kbo-mu-v12-recovered-selfstarter-oos
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore PBP cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: kbo-history-${{ runner.os }}-mechanical-mu-v13
          restore-keys: |
            kbo-history-${{ runner.os }}-mechanical-mu-
            kbo-history-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Score self-starter recovered preprocessing on 2026 OOS
        run: python scripts/audit_mu_v1_2_recovered_selfstarter_oos.py
      - name: Commit diagnostic state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/mu_v1_2_recovered_selfstarter_oos.json
          if [ -z "$(git status --porcelain -- state/mu_v1_2_recovered_selfstarter_oos.json)" ]; then
            echo "No changes."
            exit 0
          fi
          git commit -m "research: record self-starter recovered mu-v1.2 OOS audit"
          git pull --rebase origin main
          git push
