name: Test prospective KBO public quote lock provenance

on:
  push:
    branches: [main]
    paths:
      - 'scripts/capture_kbo_proto_pregame_quotes.py'
      - 'scripts/audit_kbo_pregame_quote_commits.py'
      - 'tests/test_kbo_pregame_quote_lock.py'
      - '.github/workflows/test-kbo-pregame-market-quote-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public HTML audit dependencies
        run: pip install requests beautifulsoup4
      - name: Execute timestamp, price completeness, immutable fingerprint and Git provenance regressions
        run: |
          python -m py_compile scripts/capture_kbo_proto_pregame_quotes.py scripts/audit_kbo_pregame_quote_commits.py
          python -m unittest discover -s tests -p test_kbo_pregame_quote_lock.py -v
      - name: Audit empty market-quote directory without inventing observations
        run: |
          python scripts/audit_kbo_pregame_quote_commits.py --strict
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('research/market_fair_odds/live_quote_capture_audit.json').read_text())
          assert x['status']=='AUDITED_MARKET_QUOTE_GIT_PROVENANCE_ONLY'
          assert x['not_an_executable_sportsbook_quote']
          assert x['cannot_be_scored_as_clean_pre_model']
          assert x['completed_model_vs_market_pairs']==0
          print('PUBLIC_MARKET_QUOTE_PROVENANCE_SAFETY_PASS',x['total_quote_files'])
          PY
