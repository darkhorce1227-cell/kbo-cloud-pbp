name: KBO bullpen PRE inputs integrity smoke
on:
  push:
    branches: [research/kt-bridge-pregame-20261104]
    paths:
      - '.github/workflows/research-kbo-bullpen-pre-smoke.yml'
      - 'scripts/kbo_bullpen_pregame_audit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pandas>=2.2,<3' 'pyarrow>=15' 'numpy>=1.26,<3'
      - name: Fetch verified source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/kt-bridge-verify
          gh release download latest-pbp --pattern 'kbo_pbp_2026_latest.parquet' --dir /tmp/kt-bridge-verify --clobber
          echo '32c70d31c89c83a9e8606254ff6ec084f599371b6debc6dde36066bf122c74e1  /tmp/kt-bridge-verify/kbo_pbp_2026_latest.parquet' | sha256sum -c -
      - name: KT clean prior-date candidate audit, KS1
        run: |
          python scripts/kbo_bullpen_pregame_audit.py --source /tmp/kt-bridge-verify/kbo_pbp_2026_latest.parquet --team KT --date 2026-11-03 --expect-sha 32c70d31c89c83a9e8606254ff6ec084f599371b6debc6dde36066bf122c74e1 --output /tmp/kt-bridge-verify/KT_pregame_20261103.json
          python scripts/kbo_bullpen_pregame_audit.py --source /tmp/kt-bridge-verify/kbo_pbp_2026_latest.parquet --team SS --date 2026-11-03 --expect-sha 32c70d31c89c83a9e8606254ff6ec084f599371b6debc6dde36066bf122c74e1 --output /tmp/kt-bridge-verify/SS_pregame_20261103.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KBO-pregame-bullpen-KS1-audited
          path: /tmp/kt-bridge-verify/*_pregame_20261103.json
          if-no-files-found: warn
