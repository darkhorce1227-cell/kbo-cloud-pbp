name: KBO Mechanical Mu Shadow

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_mu_v1_2_features.py"
      - "scripts/run_mu_v1_2_pipeline.py"
      - "scripts/audit_mu_v1_2_fulltrain.py"
      - "scripts/forensic_mu_v1_2_shrink.py"
      - "research/mu-v1.2/model_spec.json"
      - "state/mechanical_mu_input.json"
      - ".github/workflows/mechanical-mu-shadow.yml"

permissions:
  contents: write

concurrency:
  group: kbo-mechanical-mu-shadow
  cancel-in-progress: false

jobs:
  audit-and-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore PBP cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: kbo-history-${{ runner.os }}-mechanical-mu
          restore-keys: |
            kbo-history-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Audit 2024 reconstruction
        run: |
          python scripts/run_mu_v1_2_pipeline.py audit \
            --out state/mechanical_mu_pipeline_audit.json

      - name: Audit documented final training window
        run: python scripts/audit_mu_v1_2_fulltrain.py

      - name: Search simple shrink hypotheses
        run: python scripts/forensic_mu_v1_2_shrink.py

      - name: Build current shadow when exact parity exists and input exists
        shell: bash
        run: |
          if [ -f state/mechanical_mu_input.json ]; then
            python scripts/run_mu_v1_2_pipeline.py shadow \
              --input state/mechanical_mu_input.json \
              --audit state/mechanical_mu_fulltrain_audit.json \
              --out state/mechanical_mu_shadow.json
          fi

      - name: Save PBP cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: kbo-history-${{ runner.os }}-mechanical-mu-${{ github.run_id }}

      - name: Commit audit/shadow state
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/mechanical_mu_pipeline_audit.json state/mechanical_mu_fulltrain_audit.json state/mechanical_mu_shrink_forensics.json
          if [ -f state/mechanical_mu_shadow.json ]; then
            git add state/mechanical_mu_shadow.json
          fi
          if [ -z "$(git status --porcelain -- state/mechanical_mu_pipeline_audit.json state/mechanical_mu_fulltrain_audit.json state/mechanical_mu_shrink_forensics.json state/mechanical_mu_shadow.json)" ]; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "state: refresh mechanical mu parity/shadow"
          git pull --rebase origin main
          git push
