name: KBO Naver PBP Local Capture (Windows self-hosted)
on:
  schedule:
    - cron: "17 0,2,4,7,13,16 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: kbo-naver-local-capture
  cancel-in-progress: false
jobs:
  local-capture:
    runs-on: [self-hosted, Windows, X64, kbo-naver-local]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requests
        shell: powershell
        run: python -m pip install "requests>=2.31,<3"
      - name: Capture missing finalized original relays through yesterday KST
        shell: powershell
        run: python cloud/auto_capture_naver.py
      - name: Push immutable capture ZIPs to GitHub to trigger offline import
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "kbo-pbp-local-capture"
          git config user.email "kbo-pbp-local-capture@users.noreply.github.com"
          if (-not (Test-Path "state/auto_pbp_raw")) {
            Write-Host "NO_NEW_RAW_ARCHIVES: no new completed games"
            exit 0
          }
          git add -- "state/auto_pbp_raw"
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "NO_NEW_RAW_ARCHIVES"
            exit 0
          }
          if ($LASTEXITCODE -ne 1) { throw "git diff --cached failed: $LASTEXITCODE" }
          git commit -m "data: capture original Naver KBO relays on working local network"
          if ($LASTEXITCODE -ne 0) { throw "git commit failed" }
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { throw "git rebase failed" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "git push failed" }
          # GITHUB_TOKEN push does NOT start another push-triggered Actions workflow.
          # Explicit workflow_dispatch IS allowed and triggers cloud-side import.
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "kbo-pbp-local-capture"
          }
          $dispatchUrl = "https://api.github.com/repos/${{ github.repository }}/actions/workflows/kbo-auto-offline-import.yml/dispatches"
          Invoke-RestMethod -Method Post -Uri $dispatchUrl -Headers $headers -ContentType "application/json" -Body '{"ref":"main"}'
          Write-Host "OFFLINE_IMPORT_DISPATCHED"

