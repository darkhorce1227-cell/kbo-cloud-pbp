name: KBO Naver PBP Local Capture (Windows self-hosted)
on:
  schedule:
    - cron: "17 0,2,4,7,13,16 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kbo-naver-local-capture
  cancel-in-progress: false
jobs:
  local-capture:
    runs-on: [self-hosted, Windows, X64, kbo-naver-local]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requests
        shell: pwsh
        run: python -m pip install "requests>=2.31,<3"
      - name: Capture missing finalized original relays through yesterday KST
        shell: pwsh
        run: python cloud/auto_capture_naver.py
      - name: Push immutable capture ZIPs to GitHub to trigger offline import
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "kbo-pbp-local-capture"
          git config user.email "kbo-pbp-local-capture@users.noreply.github.com"
          git add -- "state/auto_pbp_raw/*.zip"
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "NO_NEW_RAW_ARCHIVES"
            exit 0
          }
          if ($LASTEXITCODE -ne 1) { throw "git diff --cached failed: $LASTEXITCODE" }
          git commit -m "data: capture original Naver KBO relays on working local network"
          if ($LASTEXITCODE -ne 0) { throw "git commit failed" }
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { throw "git rebase failed" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "git push failed" }
