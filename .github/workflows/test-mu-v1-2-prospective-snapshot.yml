name: Test Mu v1.2 Prospective Snapshot

on:
  push:
    paths:
      - "scripts/prepare_mu_v1_2_daily_clean_pre_input.py"
      - "scripts/capture_mu_v1_2_prospective_snapshot.py"
      - "scripts/mu_v1_2_recovered_challenger.py"
      - ".github/workflows/test-mu-v1-2-prospective-snapshot.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile prospective capture stack
        run: |
          python -m py_compile scripts/mu_v1_2_recovered_challenger.py
          python -m py_compile scripts/prepare_mu_v1_2_daily_clean_pre_input.py
          python -m py_compile scripts/capture_mu_v1_2_prospective_snapshot.py
      - name: CLI help smoke test
        run: |
          python scripts/prepare_mu_v1_2_daily_clean_pre_input.py --help
          python scripts/capture_mu_v1_2_prospective_snapshot.py --help
      - name: Verify market-unseen guard rejects unsafe capture
        run: |
          set +e
          out=$(python scripts/capture_mu_v1_2_prospective_snapshot.py 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -ne 0
          echo "$out" | grep -q "Refusing prospective CLEAN snapshot"
      - name: Verify daily CLEAN PRE preparer inserts declaration automatically
        run: |
          cat >/tmp/raw_daily.json <<'JSON'
          {
            "target_date": "2026-10-20",
            "games": [
              {
                "game_pk": "TEST-1",
                "away_team": "AWAY",
                "home_team": "HOME",
                "away_starter": "A_STARTER",
                "home_starter": "H_STARTER"
              }
            ]
          }
          JSON
          python scripts/prepare_mu_v1_2_daily_clean_pre_input.py \
            --source /tmp/raw_daily.json \
            --out /tmp/prepared_daily.json \
            --market-unseen
          python - <<'PY'
          import json
          p=json.load(open('/tmp/prepared_daily.json'))
          m=p['prospective_capture']
          assert m['clean_pre_lock'] is True, m
          assert m['market_prices_inspected'] is False, m
          assert m['declaration']=='MARKET_UNSEEN_AT_INPUT_COMMIT', m
          assert p['games'][0]['away_team']=='AWAY', p
          print('DAILY_CLEAN_PRE_PREPARER_INSERT_PASS')
          PY
      - name: Verify daily preparer rejects missing assertion and market-bearing payload
        run: |
          set +e
          out=$(python scripts/prepare_mu_v1_2_daily_clean_pre_input.py \
            --source /tmp/raw_daily.json --out /tmp/unsafe.json 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -ne 0
          echo "$out" | grep -q "explicit market-unseen declaration is required"

          python - <<'PY'
          import json
          p=json.load(open('/tmp/raw_daily.json'))
          p['market_odds']={'away':1.90,'home':1.80}
          json.dump(p, open('/tmp/raw_daily_with_market.json','w'))
          PY
          set +e
          out=$(python scripts/prepare_mu_v1_2_daily_clean_pre_input.py \
            --source /tmp/raw_daily_with_market.json \
            --out /tmp/unsafe_market.json \
            --market-unseen 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -ne 0
          echo "$out" | grep -q "market-related keys found"
      - name: Verify embedded daily CLEAN PRE declaration contract
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import capture_mu_v1_2_prospective_snapshot as c

          good = {
              'prospective_capture': {
                  'clean_pre_lock': True,
                  'market_prices_inspected': False,
                  'declaration': 'MARKET_UNSEEN_AT_INPUT_COMMIT',
              }
          }
          ok, meta = c.embedded_clean_pre_declaration(good)
          assert ok is True, (ok, meta)

          bad_seen = {
              'prospective_capture': {
                  'clean_pre_lock': True,
                  'market_prices_inspected': True,
                  'declaration': 'MARKET_UNSEEN_AT_INPUT_COMMIT',
              }
          }
          assert c.embedded_clean_pre_declaration(bad_seen)[0] is False
          assert c.embedded_clean_pre_declaration({})[0] is False
          print('EMBEDDED_CLEAN_PRE_DECLARATION_GUARD_PASS')
          PY
