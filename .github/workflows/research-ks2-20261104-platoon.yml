name: KS2 platoon actual 2026 pitcher splits
on:
  push:
    branches: [research/ks2-20261104-market-blind]
    paths:
      - '.github/workflows/research-ks2-20261104-platoon.yml'
      - 'scripts/research_ks2_20261104_pitcher_platoon.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platoon:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pandas>=2.2,<3' 'pyarrow>=15' 'numpy>=1.26,<3'
      - name: Download hash-verified original through Nov 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ks2split
          gh release download latest-pbp --pattern 'kbo_pbp_2026_latest.parquet' --dir /tmp/ks2split --clobber
          echo '32c70d31c89c83a9e8606254ff6ec084f599371b6debc6dde36066bf122c74e1  /tmp/ks2split/kbo_pbp_2026_latest.parquet' | sha256sum -c -
      - run: python scripts/research_ks2_20261104_pitcher_platoon.py
