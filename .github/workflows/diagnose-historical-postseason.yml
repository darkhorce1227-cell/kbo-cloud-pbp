name: Diagnose Historical Postseason API
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Probe all postseason games in comparison years
        run: python scripts/diagnose_historical_postseason.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-postseason-api-diagnostics
          path: historical_ps_diagnostics/
          if-no-files-found: warn
