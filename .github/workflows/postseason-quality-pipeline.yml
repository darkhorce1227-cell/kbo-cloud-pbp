name: One-click Historical Postseason Quality Pipeline
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Space-separated years, e.g. 2008 2009 2010 2011 2012 2021"
        required: true
        default: "2008 2009 2010 2011 2012 2021"
  schedule:
    - cron: '30 2 1 * *'
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Download existing releases and run quality gate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_YEARS: ${{ inputs.years }}
        run: |
          set -euo pipefail
          YEARS="${REQUESTED_YEARS:-2008 2009 2010 2011 2012 2021}"
          mkdir -p historical_ps
          for YEAR in $YEARS; do
            if ! [[ "$YEAR" =~ ^20[0-2][0-9]$ ]]; then
              echo "Invalid year: $YEAR"; exit 1
            fi
            gh release download "historical-ps-$YEAR" --pattern "kbo_ps_${YEAR}_raw.tar.gz" --dir /tmp
            tar -xzf "/tmp/kbo_ps_${YEAR}_raw.tar.gz" -C historical_ps
          done
          python scripts/postseason_quality_gate.py --years $YEARS
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postseason-quality-reports
          path: |
            historical_ps/quality_summary.json
            historical_ps/quality_summary.csv
            historical_ps/*/quality_by_game.csv
          if-no-files-found: warn
