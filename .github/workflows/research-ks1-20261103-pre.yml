name: KS1 2026-11-03 Market-Blind Research PRE
on:
  push:
    branches: [research/ps-follower-runs-20261102]
    paths:
      - '.github/workflows/research-ks1-20261103-pre.yml'
      - 'scripts/research_ks1_20261103_premarket.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-pre:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'scipy>=1.11' 'numpy>=1.26,<3'
      - name: Fetch latest validated 2026 PBP (Nov 1 frozen)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ks1
          gh release download latest-pbp --pattern 'kbo_pbp_2026_latest.parquet' --dir /tmp/ks1 --clobber
          test -s /tmp/ks1/kbo_pbp_2026_latest.parquet
          sha256sum /tmp/ks1/kbo_pbp_2026_latest.parquet
      - name: Produce market-blind model shadow with hard provenance checks
        run: python scripts/research_ks1_20261103_premarket.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ks1-premarket-shadow-20261103
          path: /tmp/ks1/ks1_20261103_shadow.json
          if-no-files-found: warn
