name: Audit Mu v1.2 Candidate Preprocessing

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_mu_v1_2_candidate_preprocessing.py"
      - ".github/workflows/audit-mu-v1-2-candidate-preprocessing.yml"

permissions:
  contents: write

concurrency:
  group: audit-mu-v1-2-candidate-preprocessing
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore PBP cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: kbo-history-${{ runner.os }}-mechanical-mu
          restore-keys: |
            kbo-history-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Audit candidate preprocessing
        run: python scripts/audit_mu_v1_2_candidate_preprocessing.py

      - name: Save PBP cache
        uses: actions/cache/save@v4
        with:
          path: data
          key: kbo-history-${{ runner.os }}-audit-mu-candidate-${{ github.run_id }}

      - name: Commit diagnostic state
        shell: bash
        run: |
          test -f state/mu_v1_2_candidate_preprocessing_audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state/mu_v1_2_candidate_preprocessing_audit.json
          if git diff --cached --quiet; then
            echo "No diagnostic changes."
            exit 0
          fi
          git commit -m "research: record mu-v1.2 candidate preprocessing audit"
          git push
