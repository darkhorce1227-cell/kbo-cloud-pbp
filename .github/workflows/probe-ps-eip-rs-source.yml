name: Probe PS EIP RS Source

on:
  push:
    paths:
      - 'scripts/probe_ps_eip_rs_source.py'
      - '.github/workflows/probe-ps-eip-rs-source.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Probe Naver regular-season starter fields
        run: python scripts/probe_ps_eip_rs_source.py
