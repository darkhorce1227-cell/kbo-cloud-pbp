name: Diagnose RS-PS starter join

on:
  push:
    paths:
      - '.github/workflows/diagnose-rs-ps-join.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime deps
        run: pip install -r requirements.txt

      - name: Verify target postseason starter identities from Naver inning-1 relay
        run: |
          python - <<'PY'
          from kbo_pbp import naver, schedule

          targets = {
              2018: '33331023HHWO02018',
              2022: '77771105SKWO02022',
          }

          for year, target in targets.items():
              season = schedule.fetch(year)
              ps = schedule.playable(season, rounds=schedule.POSTSEASON)
              print('\nYEAR', year, 'PS_GAMES', len(ps), 'TARGET', target)
              matched_schedule = []
              for _, row in ps.iterrows():
                  g = row.to_dict()
                  gid = str(g.get('gameId') or g.get('id') or '')
                  candidates = [gid]
                  if gid and not gid.endswith(str(year)):
                      candidates.append(gid + str(year))
                  date = str(g.get('gameDate') or '')[:10].replace('-', '')
                  away = str(g.get('awayTeamCode') or '').strip()
                  home = str(g.get('homeTeamCode') or '').strip()
                  if len(date) == 8 and away and home:
                      for h in ('0','1','2'):
                          candidates.append(f'{date}{away}{home}{h}{year}')
                  if target in candidates:
                      matched_schedule.append((gid, g.get('gameDate'), away, home, g.get('roundCode')))
              print('SCHEDULE_MATCH', matched_schedule)

              relay = naver.fetch_relay(target, 1)
              for side in ('away', 'home'):
                  pitchers = ((relay.get(f'{side}Lineup') or {}).get('pitcher') or [])
                  pitchers = sorted(pitchers, key=lambda p: int(p.get('seqno') or 999))
                  print(side.upper(), 'PITCHERS')
                  for p in pitchers:
                      print({
                          'seqno': p.get('seqno'),
                          'pcode': p.get('pcode'),
                          'name': p.get('name'),
                          'inn': p.get('inn'),
                          'ballCount': p.get('ballCount'),
                          'run': p.get('run'),
                          'er': p.get('er'),
                      })
                  if not pitchers:
                      raise SystemExit(f'{year} {side}: no pitcher lineup')
                  starter = pitchers[0]
                  print('STARTER', side, {
                      'seqno': starter.get('seqno'),
                      'pcode': starter.get('pcode'),
                      'name': starter.get('name'),
                      'inn': starter.get('inn'),
                  })
          PY
