name: 2026 lineup predate proxy OOS research
on:
  push:
    branches: [research/lineup-skill-20261104]
    paths:
      - '.github/workflows/research-lineup-2026-oos.yml'
      - 'scripts/research_lineup_pre_date_oos_2026.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lineup-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'pyarrow>=15' 'scipy>=1.11' 'scikit-learn>=1.3'
      - name: Fetch immutable 2026 PBP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/kbo-lineup
          gh release download latest-pbp --pattern 'kbo_pbp_2026_latest.parquet' --dir /tmp/kbo-lineup --clobber
          echo '32c70d31c89c83a9e8606254ff6ec084f599371b6debc6dde36066bf122c74e1  /tmp/kbo-lineup/kbo_pbp_2026_latest.parquet' | sha256sum -c -
      - name: Historical as-of lineup proxy and heldout tests
        run: python scripts/research_lineup_pre_date_oos_2026.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KBO-2026-lineup-asof-OOS-research
          path: /tmp/kbo-lineup/lineup_shadow_oos.json
          if-no-files-found: warn
