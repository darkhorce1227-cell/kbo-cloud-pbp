name: Research offense platoon v2 integrity and matched replay
on:
  push:
    branches: [research/offense-platoon-v2-20261106]
    paths:
      - 'scripts/research_offense_platoon_v2.py'
      - 'scripts/collect_kbo_pitcher_hands.py'
      - 'tests/test_offense_platoon_v2.py'
      - 'research/offense-platoon-v2/study_plan.json'
      - 'research/offense-platoon-v2/pitcher_hands_20261106.json'
      - '.github/workflows/research-offense-platoon-v2.yml'
  workflow_dispatch:
    inputs:
      frozen_source_run:
        description: 'Optional earlier run of this workflow containing its frozen 2026 CSV artifact'
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install 'pandas>=2.2,<3' 'numpy>=1.26,<3' 'scipy>=1.11' 'scikit-learn>=1.3'
      - name: Same-date isolation and probability invariants
        run: python -m unittest discover -s tests -p test_offense_platoon_v2.py -v
      - name: Frozen sources
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.frozen_source_run }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/kbo-offense-v2/historical /tmp/kbo-offense-v2/2026
          gh run download 37073907739 --repo darkhorce1227-cell/kbo-cloud-pbp --name kbo-mu-training-pbp-2024-2025 --dir /tmp/kbo-offense-v2/historical
          if test -n "$SOURCE_RUN"; then
            gh run download "$SOURCE_RUN" --repo darkhorce1227-cell/kbo-cloud-pbp --name offense-platoon-v2-frozen-2026-source --dir /tmp/kbo-offense-v2/2026
          else
            gh release download latest-pbp --pattern kbo_pbp_2026_latest.csv.gz --dir /tmp/kbo-offense-v2/2026
          fi
      - name: Frozen-plan matched replay
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -u scripts/research_offense_platoon_v2.py \
            --source /tmp/kbo-offense-v2/historical/kbo_pbp_2024_training.csv.gz \
                     /tmp/kbo-offense-v2/historical/kbo_pbp_2025_training.csv.gz \
                     /tmp/kbo-offense-v2/2026/kbo_pbp_2026_latest.csv.gz \
            --hands research/offense-platoon-v2/pitcher_hands_20261106.json \
            --output /tmp/kbo-offense-v2/results
      - name: Retain complete evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offense-platoon-v2-results
          path: /tmp/kbo-offense-v2/results
          retention-days: 90
          if-no-files-found: warn
      - name: Retain exact changing 2026 release bytes
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: offense-platoon-v2-frozen-2026-source
          path: /tmp/kbo-offense-v2/2026/kbo_pbp_2026_latest.csv.gz
          retention-days: 90
          if-no-files-found: error
